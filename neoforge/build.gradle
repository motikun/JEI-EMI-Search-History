plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev'
}

version = ""
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.sleeping.town' }
}

base {
    archivesName = "${mod_id}-${mod_version}-mc1.21.1-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Opt-in integration fixture. It is excluded from normal builds and uses an isolated game directory.
if (project.hasProperty('clientSmoke')) {
    sourceSets.main.java.srcDir '../src/clientSmokeJei/java'
}
if (project.hasProperty('emiSmoke')) {
    sourceSets.main.java.srcDir '../src/clientSmokeEmi/java'
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            if (project.hasProperty('worldSmoke')) {
                gameDirectory = rootProject.file('run-world-neoforge')
                systemProperty 'jeihistory.worldCases', project.findProperty('worldCases') ?: '24'
                programArguments.addAll '--quickPlayMultiplayer', '127.0.0.1:25575'
            }
            gameDirectory = rootProject.file(project.hasProperty('worldSmoke') ? 'run-world-neoforge' : 'run')
            if (project.hasProperty('clientSmoke')) {
                gameDirectory = rootProject.file('run-client-smoke')
            }
            if (project.hasProperty('emiSmoke')) {
                gameDirectory = rootProject.file('run-emi-smoke')
                systemProperty 'jeihistory.emiSmokeRestart', project.hasProperty('emiSmokeRestart').toString()
            }

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            if (project.hasProperty('serverSmoke')) {
                gameDirectory = rootProject.file('run-server-smoke')
                jvmArgument '-Xlog:class+load=info:file=server-class-loading.log'
            }
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = rootProject.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation project(':common')
    // Optional recipe-viewer GUI classes are resolved only by their client integrations.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_compile_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    if (!project.hasProperty('emiOnly')) {
        def pinnedJei = rootProject.file("build/compatibility-cache/jei/${jei_version}.jar")
        if (project.hasProperty('clientSmoke') && pinnedJei.exists()) {
            // The compatibility script checks this published artifact's SHA-512 first.
            runtimeOnly files(pinnedJei)
        } else {
            runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        }
    }
    if (project.hasProperty('withEmi') || project.hasProperty('emiOnly') || project.hasProperty('emiSmoke') || project.hasProperty('worldSmoke')) {
        runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft supplies these libraries in-game; plain JUnit needs its own runtime.
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.9'
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    replaceProperties.jei_version_range = jei_version_range
    replaceProperties.emi_version_range = emi_version_range
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
tasks.named('test', Test) {
    useJUnitPlatform()
}

// A development flag must never put auto-running test fixtures in a distribution JAR.
tasks.named('jar', Jar) {
    exclude 'net/motikun/jeihistory/smoke/**'
}

// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

if (project.hasProperty('clientSmoke') || project.hasProperty('emiSmoke')) {
    def smokeDirectory = project.file(project.hasProperty('emiSmoke') ? 'run-emi-smoke' : 'run-client-smoke')
    def resetSmokeConfig = tasks.register('resetJeiSmokeConfig', Delete) {
        // Avoid JEI's own downgrade diagnostics in the isolated version matrix.
        delete new File(smokeDirectory, 'config/jei')
        delete new File(smokeDirectory, 'config/mezz_config')
    }
    tasks.named('runClient').configure { dependsOn resetSmokeConfig }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

sourceSets.main.java.srcDir '../common/src/client/java'
sourceSets.main.resources.srcDir '../common/src/client/resources'
tasks.named('jar') { from project(':common').sourceSets.main.output.classesDirs }

if (project.hasProperty('modernUi')) {
    dependencies {
        runtimeOnly 'icyllis.modernui:ModernUI-NeoForge:1.21.1-3.13.0.1@jar'
        additionalRuntimeClasspath('dev.icyllis:modernui-core:3.13.0') {
            exclude group: 'org.slf4j'
            exclude group: 'org.apache.logging.log4j'
            exclude group: 'com.google.code.findbugs'
            exclude group: 'org.jetbrains'
            exclude group: 'com.ibm.icu'
            exclude group: 'it.unimi.dsi'
        }
        additionalRuntimeClasspath('icyllis.modernui:ModernUI-Markflow:3.13.0') {
            exclude group: 'org.slf4j'
            exclude group: 'org.jetbrains'
        }
    }
}

if (project.hasProperty('worldSmoke')) sourceSets.main.java.srcDir 'src/worldSmoke/java'
